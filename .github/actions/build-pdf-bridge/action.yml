name: Build PDF native bridge
description: >
  Cross-compiles the kernkraft-jni crate of verycareful/kernkraft into
  jniLibs/<abi>/libkernkraft_jni.so, so the packaged APK ships the native PDF
  engine and KernkraftPdf.available is true. See src/pdf-bridge/README.md.

inputs:
  kernkraft-repo:
    description: kernkraft repository (owner/name) that holds the kernkraft-jni crate.
    default: verycareful/kernkraft
  kernkraft-ref:
    description: Commit sha of kernkraft to build from.
    default: 8c0d299bf3a882f282360e2343ac10065677e99f
  abis:
    description: Space-separated cargo-ndk ABIs to build.
    default: arm64-v8a armeabi-v7a x86_64

runs:
  using: composite
  steps:
    - name: Set up Rust with Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Point cargo-ndk at the runner's Android NDK
      shell: bash
      run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

    - name: Fetch kernkraft at the pinned commit
      shell: bash
      run: |
        git init kernkraft
        cd kernkraft
        git remote add origin "https://github.com/${{ inputs.kernkraft-repo }}.git"
        git fetch --depth 1 origin "${{ inputs.kernkraft-ref }}"
        git checkout --detach FETCH_HEAD
        test -f crates/kernkraft-jni/Cargo.toml || { echo "kernkraft-jni not found in ${{ inputs.kernkraft-repo }}@${{ inputs.kernkraft-ref }}"; exit 1; }

    - name: Build libkernkraft_jni.so for each ABI
      shell: bash
      run: |
        targets=""
        for abi in ${{ inputs.abis }}; do targets="$targets -t $abi"; done
        cd kernkraft
        cargo ndk $targets -o "$GITHUB_WORKSPACE/jniLibs" build --release -p kernkraft-jni --locked

    - name: Verify the libraries landed
      shell: bash
      run: |
        for abi in ${{ inputs.abis }}; do
          test -f "$GITHUB_WORKSPACE/jniLibs/$abi/libkernkraft_jni.so" || { echo "missing $abi/libkernkraft_jni.so"; exit 1; }
        done
        ls -R "$GITHUB_WORKSPACE/jniLibs"
